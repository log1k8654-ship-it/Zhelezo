/* Workout summary: "Сегодня прокачано" with the groups of this workout. */
function mmSummary(w) {
  const G = {};
  for (const it of w.items) { const g = exById(it.ex).group; G[g] = (G[g] || 0) + it.sets.length; }
  const gs = Object.keys(G).sort((a, b) => G[b] - G[a]);
  if (!gs.length) return '';
  const lv = Object.fromEntries(gs.map(g => [g, mmLevel(G[g], MM_STEPS[1])]));
  return `<div class="mm-sum">${mmSVG(lv, { cls: 'mm-mini', pop: gs, label: 'Сегодня прокачано: ' + gs.map(g => `${g} — ${mmSets(G[g])}`).join(', ') })}
    <div><p class="label">Сегодня прокачано</p><ul class="mm-sum-l">${gs.map(g => `<li><i class="mm-sw mq${lv[g]}"></i><span>${g}</span><b>${G[g]}</b></li>`).join('')}</ul>
    <p class="mm-sum-n">${mmSets(gs.reduce((a, g) => a + G[g], 0))} на ${gs.length > 1 ? pl(gs.length, 'группу', 'группы', 'групп') : 'одну группу'} мышц${gs.includes('Другое') ? ' · «Другое» на схеме не показано' : ''}</p></div></div>`;
}

/* Home hint: a group trained regularly that has rested much longer than usual.
   Shown only while the person keeps training (a workout in the last week) and at most one at a time. */
function mmRest(A) {
  const now = Date.now(), today = dayStart(now);
  if (A.ws.length < 4 || today - dayStart(A.ws[A.ws.length - 1].start) > 6 * DAY) return null;
  const from = addDays(today, -56), days = {};
  for (const w of A.ws) {
    if (w.start < from) continue;
    for (const it of w.items) { const g = exById(it.ex).group; (days[g] ||= new Set()).add(dayStart(w.start)); }
  }
  let best = null;
  for (const g of MM_DRAWN) {
    const ds = [...(days[g] || [])].sort((a, b) => a - b);
    if (ds.length < 2) continue;
    const gaps = ds.slice(1).map((d, i) => (d - ds[i]) / DAY).sort((a, b) => a - b);
    const typ = gaps[gaps.length >> 1], rest = Math.round((today - ds[ds.length - 1]) / DAY);
    const need = Math.max(8, Math.round(typ * 1.5)), score = rest / need;
    if (rest >= need && (!best || score > best.score)) best = { g, rest, last: ds[ds.length - 1], score };
  }
  if (!best) return null;
  const fav = {};
  for (const w of A.ws) if (w.start >= from) for (const it of w.items) if (exById(it.ex).group === best.g) fav[it.ex] = (fav[it.ex] || 0) + it.sets.length;
  best.ex = Object.keys(fav).sort((a, b) => fav[b] - fav[a])[0];
  return best;
}
function mmHint(A) {
  const r = mmRest(A);
  if (!r) return '';
  const lv = mmLevels(mmStats(7), MM_STEPS[7]);
  const verb = MM_PLURAL.has(r.g) ? 'отдыхают' : 'отдыхает';
  return `<button class="card mm-hint" data-a="mm-go" data-g="${r.g}">${mmSVG(lv, { one: MM_VIEW[r.g] || 'f', mark: r.g, cls: 'mm-one', label: `${r.g} на схеме` })}
    <span><span class="label">Карта мышц</span><b class="mm-hint-t">${r.g} ${verb} уже ${pl(r.rest, 'день', 'дня', 'дней')}</b>
    <span class="note">Последний раз — ${dLong(r.last)}.${r.ex ? ` Добавьте в следующую тренировку: ${esc(mmLc(exById(r.ex).name))}.` : ''}</span></span>${svg('<path d="m9 6 6 6-6 6"/>')}</button>`;
}

function heatmap(A) {

  const max = Math.max(1, ...Object.values(dv));

    const v = dv[t];

    if (t > today) c += ' fut';

    if (t === today) c += ' today';
    cells += `<i class="${c}" title="${dShort(t)}${v ? ': ' + fmtKg(v - 1) : ''}"></i>`;
  }
  return `<section><div class="h-sec"><p class="label">15 недель</p><span class="note">${pl(cnt, 'тренировка', 'тренировки', 'тренировок')}</span></div>
    <div class="heat"><div class="heat-days" aria-hidden="true"><span>пн</span><span></span><span>ср</span><span></span><span>пт</span><span></span><span>вс</span></div><div class="heat-grid">${cells}</div></div>

  if (b) b.textContent = pl(st.n, 'подход', 'подхода', 'подходов');

function viewHistory() {
  const A = an(), list = A.ws.slice().reverse();
  if (!list.length) return emptyState('История пока пуста', 'Здесь появится каждая тренировка: дата, упражнения, подходы и тоннаж.', 'history');
  let h = `<section><h1 class="h1">История</h1><p class="note" style="margin-top:4px">${pl(list.length, 'тренировка', 'тренировки', 'тренировок')} · ${fmtT(A.totalVol)} · ${fmtKcal(A.totalKcal)} · с ${dLong(A.ws[0].start)}</p></section>`;
  const mk = t => { const d = new Date(t); return d.getFullYear() * 12 + d.getMonth(); };
  const perMonth = {};
  list.forEach(w => { const k = mk(w.start); perMonth[k] = (perMonth[k] || 0) + 1; });
  let cur = null;
  list.slice(0, ui.histLimit).forEach(w => {
    const k = mk(w.start);
    if (k !== cur) {
      cur = k; const d = new Date(w.start);
      h += `<div class="month"><h2>${MON[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}</h2><span>${pl(perMonth[k], 'тренировка', 'тренировки', 'тренировок')}</span></div>`;
    }
    h += wcard(w, A);
  });
  if (list.length > ui.histLimit) h += `<button class="btn btn-ghost btn-wide" data-a="more-hist">Показать ещё</button>`;
  return h;
}
function wcard(w, A) {
  const inf = A.info[w.id], open = ui.openW === w.id, d = new Date(w.start);
  const prByEx = {};
  inf.prs.forEach(p => { prByEx[p.ex] = p; });
  const score = s => e1rm(s.w, s.r) || s.r / 1000;
  const lines = w.items.map(it => {
    const ex = exById(it.ex), top = it.sets.reduce((a, s) => score(s) > score(a) ? s : a);
    return `<li><span>${esc(ex.name)}</span><span>${prByEx[it.ex] ? '<i class="wl-rec" role="img" aria-label="рекорд">★</i>' : ''}${it.sets.length}${NB}подх · ${fmtSet(top, ex)}</span></li>`;
  }).join('');
  const durMs = w.end - w.start;
  let det = '';
  if (open) {
    det = `<div class="wdetail">${w.items.map(it => {
      const ex = exById(it.ex), p = prByEx[it.ex];
      return `<div class="wd-ex"><div class="wd-name">${esc(ex.name)}${p ? ` <i class="chip chip-rec">${prText(p)}</i>` : ''}</div><div class="scs">${it.sets.map(s => {
        const rec = p && ((p.kind !== 'r' && s.w === p.w && s.r === p.r) || (p.kind === 'r' && s.w === 0 && s.r === p.r));
        return `<span class="sc${rec ? ' rec' : ''}">${fmtSet(s, ex)}</span>`;
      }).join('')}</div></div>`;
    }).join('')}
    <p class="note">${hm(w.start)}${durMs > 60000 ? '–' + hm(w.end) : ''} · ${fmtKg(inf.vol)} · ≈${NB}${fmtKcal(inf.kcal)}${w.mood ? ` · ${MOODS[w.mood - 1][0]} ${MOODS[w.mood - 1][1].toLowerCase()}` : ''}</p>
    <button class="sc-pill" data-a="sc-open" data-id="${esc(w.id)}">${ICON.share}Поделиться карточкой</button>
    <div class="wd-actions"><button class="btn btn-ghost" data-a="repeat" data-id="${esc(w.id)}">Повторить</button><button class="btn btn-danger" data-a="w-del" data-id="${esc(w.id)}">Удалить</button></div></div>`;
  }
  return `<article class="wcard">
    <button class="wsum" data-a="toggle-w" data-id="${esc(w.id)}" aria-expanded="${open}">
      <span class="wdate"><b>${d.getDate()}</b><span>${WD[d.getDay()]}</span></span>
      <span><span class="wtitle">${esc(inf.title)}${w.mood ? `<span class="wmood" role="img" aria-label="${MOODS[w.mood - 1][1]}">${MOODS[w.mood - 1][0]}</span>` : ''}</span>
        <span class="wstats">${durMs > 60000 ? `<span>${dur(durMs)}</span>` : ''}<span>${fmtKg(inf.vol)}</span><span>${fmtKcal(inf.kcal)}</span>${inf.prs.length ? `<i class="chip chip-rec">${pl(inf.prs.length, 'рекорд', 'рекорда', 'рекордов')}</i>` : ''}</span>
        ${open ? '' : `<ul class="wlines">${lines}</ul>`}
      </span>
    </button>${det}</article>`;
}

function viewProgress() {
  const A = an(), now = Date.now();
  const ids = Object.keys(A.perEx).sort((a, b) => A.perEx[b].length - A.perEx[a].length || exById(a).name.localeCompare(exById(b).name, 'ru'));
  if (!ids.length) return emptyState('Графики появятся после первой тренировки', 'Запишите хотя бы одно упражнение, и здесь будет видно, как растут веса и объём.', 'progress') + bodyCard();
  if (!ui.progEx || !A.perEx[ui.progEx]) ui.progEx = ids[0];
  const id = ui.progEx, ss = A.perEx[id];
  const bwOnly = ss.every(s => s.maxW === 0);
  const metrics = bwOnly ? [['r', 'Лучший подход'], ['v', 'Повторы за день']] : [['e', '1ПМ'], ['w', 'Макс. вес'], ['v', 'Тоннаж']];
  if (!metrics.some(m => m[0] === ui.progMetric)) ui.progMetric = metrics[0][0];
  const m = ui.progMetric;
  const val = s => m === 'e' ? r05(s.e1) : m === 'w' ? s.maxW : m === 'r' ? s.reps : (bwOnly ? s.rt : s.vol);
  const isReps = m === 'r' || (m === 'v' && bwOnly);
  const fmtY = v => isReps ? `${NF0.format(v)}` : (m === 'v' ? fmtKg(v) : `${fmtW(v)}`);
  const fmtTick = v => (!isReps && m === 'v') ? (v >= 1000 ? NF1.format(v / 1000) + NB + 'т' : NF0.format(v)) : NF1.format(v);
  const unit = isReps ? 'повт' : 'кг';
  const pts = ss.map(s => ({ t: s.t, y: val(s), pr: !!s.pr }));
  const cur = pts[pts.length - 1].y, first = pts[0].y, dlt = cur - first;
  const big = m === 'v' && !bwOnly ? fmtKg(cur).replace(NB + 'кг', `<small>кг</small>`).replace(NB + 'т', '<small>т</small>') : `${m === 'e' ? '≈' : ''}${fmtW(cur)}<small>${unit}</small>`;
  const dtxt = pts.length > 1
    ? `<span class="${dlt > 0 ? 'up' : dlt < 0 ? 'down' : ''}">${dlt > 0 ? '+' : dlt < 0 ? '−' : '±'}${m === 'v' && !bwOnly ? fmtKg(Math.abs(dlt)) : fmtW(Math.abs(dlt)) + NB + unit}</span> с ${dLong(first ? pts[0].t : pts[0].t)} · ${pl(ss.length, 'занятие', 'занятия', 'занятий')}`
    : 'Пока одно занятие. После следующего появится линия прогресса.';
  const explain = { e: '1ПМ — расчётный разовый максимум по лучшему подходу: вес × (1 + повторы / 30).', w: 'Самый тяжёлый рабочий вес за занятие.', v: bwOnly ? 'Сумма повторений во всех подходах за занятие.' : 'Тоннаж — сумма «вес × повторы» во всех подходах упражнения.', r: 'Больше всего повторений в одном подходе.' }[m];

  const wk = weekly(A);
  let h = `<h1 class="h1">Прогресс</h1>${statTiles(A, wk)}<section class="stack"><p class="label">По упражнениям</p>
    <select class="field" id="prog-ex" aria-label="Упражнение">${ids.map(i => `<option value="${esc(i)}"${i === id ? ' selected' : ''}>${esc(exById(i).name)} · ${A.perEx[i].length}</option>`).join('')}</select>
    <div class="seg" role="group" aria-label="Показатель">${metrics.map(([k, l]) => `<button data-a="prog-m" data-m="${k}" aria-pressed="${k === m}">${l}</button>`).join('')}</div></section>
    <section class="card stack"><div><div class="big-num">${big}</div><p class="note" style="margin-top:6px">${dtxt}</p></div>
      ${pts.length > 1 ? `${lineChart(pts, fmtY, fmtTick)}
      <div class="chart-legend"><span><i style="background:var(--act-ink)"></i>${esc(metrics.find(x => x[0] === m)[1])} по занятиям</span><span><i style="background:var(--red)"></i>новый рекорд</span></div>` : `<div class="art-teaser">${emptyArt('progress')}</div>`}
      <p class="note">${explain}</p></section>`;

  const rows = ss.slice(-8).reverse().map(s => `<tr><td>${dShort(s.t)}</td><td class="num">${fmtSet(s.top, exById(id))}${s.pr ? ' <i class="chip chip-rec">PR</i>' : ''}</td><td class="num">${s.e1 ? '≈' + fmtW(r05(s.e1)) : '—'}</td><td class="num">${bwOnly ? s.rt : fmtKg(s.vol)}</td></tr>`).join('');
  h += `<section class="stack"><p class="label">Последние занятия</p><div class="tbl-wrap"><table class="t"><thead><tr><th>Дата</th><th class="num">Лучший</th><th class="num">1ПМ</th><th class="num">${bwOnly ? 'Повт.' : 'Тоннаж'}</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;

  h += mmCard();
  h += heatmap(A);
  const weeks = [];
  for (let k = 11; k >= 0; k--) { const t = addDays(wk.cur, -7 * k); weeks.push({ t, v: wk.volMap[t] || 0, cur: k === 0 }); }
  h += `<section class="card stack"><div class="h-sec"><p class="label">Тоннаж по неделям</p><span class="note">все упражнения</span></div>${barChart(weeks)}</section>`;
  h += `<section class="card"><p class="label">Всего поднято</p><div class="big-t">${fmtT(A.totalVol)}</div><p class="note" style="margin-top:6px">${compareLine(A.totalVol)}</p></section>`;
  const kw = weeks.map(x => ({ ...x, v: wk.kcalMap[x.t] || 0 }));
  h += `<section class="card stack"><div class="h-sec"><p class="label">Калории по неделям</p><span class="note">12 недель</span></div>
    ${barChart(kw, v => NF0.format(v), fmtKcal, 300, 'Калории по неделям')}
    <p class="note">Оценка: ${MET}${NB}МЕТ × вес тела × время тренировки. ${S.body.length ? `Вес берётся из записей ниже.` : `Пока считаю для ${DEF_KG}${NB}кг: запишите свой вес ниже, и цифры станут точнее.`}</p></section>`;
  h += bodyCard();
  const moods = A.ws.filter(w => w.mood && w.start > now - 30 * DAY);
  if (moods.length >= 2) {
    const cnt = MOODS.map((m, k) => moods.filter(w => w.mood === k + 1).length), top = cnt.lastIndexOf(Math.max(...cnt));
    const avg = moods.reduce((a, w) => a + w.mood, 0) / moods.length;
    h += `<section class="card stack"><div class="h-sec"><p class="label">Самочувствие</p><span class="note">30 дней</span></div>
      <div class="mood-row" aria-hidden="true">${MOODS.map((m, k) => `<div class="mood-b"${k === top ? ' aria-pressed="true"' : ''}><span>${m[0]}</span>${cnt[k]}</div>`).join('')}</div>
      <p class="note">Чаще всего после тренировки: ${MOODS[top][0]} ${MOODS[top][1].toLowerCase()}. ${avg >= 3.5 ? 'Тренировки заряжают, так держать!' : avg >= 2.5 ? 'Ровно и стабильно.' : 'Похоже, нагрузка тяжеловата: стоит больше спать и отдыхать между тренировками.'}</p></section>`;
  }

  return h;
}

function bodyCard() {
  const b = S.body, last = b[b.length - 1];
  let top = `<p class="note">Запишите вес, чтобы калории считались точнее и было видно, как меняется тело.</p>`;
  if (last) {
    const first = b[0], d = Math.round((last.kg - first.kg) * 10) / 10;
    top = `<div><div class="big-num">${fmtW(last.kg)}<small>кг</small></div><p class="note" style="margin-top:6px">${b.length > 1 ? `${d > 0 ? '+' : d < 0 ? '−' : '±'}${fmtW(Math.abs(d))}${NB}кг с ${dLong(first.t)} · ` : ''}${dLong(last.t)}</p></div>`;
    if (b.length > 1) top += lineChart(b.map(e => ({ t: e.t, y: e.kg })), v => fmtW(v), v => NF1.format(v));
  }
  return `<section class="card stack"><div class="h-sec"><p class="label">Вес тела</p>${last ? `<button class="btn btn-text btn-sm" data-a="bw-del">Убрать последнюю</button>` : ''}</div>${top}
    <div class="bw-row"><input class="field" id="bw-in" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="Вес сегодня, кг" aria-label="Вес тела сегодня, кг"><button class="btn btn-act" data-a="bw-add">Записать</button></div></section>`;
}
function viewRecords() {
  const A = an(), R = achAll(), seg = ui.awSeg === 'rec' ? 'rec' : 'ach';
  let h = levelCard(A);
  h += `<div class="seg aw-seg" role="group" aria-label="Раздел наград">${[['ach', 'Медали', `${R.done}/${R.list.length}`], ['rec', 'Рекорды', A.prs.length]].map(([k, l, n]) =>
    `<button data-a="aw-seg" data-s="${k}" aria-pressed="${seg === k}">${l}<small>${n}</small></button>`).join('')}</div>`;
  if (seg === 'ach') return h + achSection();
  const tri = [['squat', 'Присед'], ['bench', 'Жим'], ['deadlift', 'Тяга']], has = x => A.best[x[0]] && A.best[x[0]].w > 0;
  const isTri = tri.every(has);
  const B3 = (isTri ? tri : [['hip_thrust', 'Мост'], ['squat', 'Присед'], ['deadlift', 'Тяга'], ['rdl', 'Румынская'], ['leg_press', 'Жим ногами'], ['bench', 'Жим']].filter(has).slice(0, 3))
    .map((x, k) => [x[0], x[1], ['--act', '--red', '--yellow'][k]]);
  if (B3.length) {
    const sum = B3.reduce((a, x) => a + A.best[x[0]].w, 0);
    h += `<section class="card"><div class="h-sec"><p class="label">${isTri ? 'Сумма троеборья' : 'Главные веса'}</p><span class="note">лучшие веса</span></div>
      <div class="big-t">${fmtW(sum)}${NB}кг</div>
      <div class="big3">${B3.map(([id, l, c]) => `<div style="--c:var(${c})"><span>${l}</span><b>${fmtW(A.best[id].w)}</b><span>× ${A.best[id].wR} · ${dShort(A.best[id].wT)}</span></div>`).join('')}</div></section>`;
  }
  const ids = Object.keys(A.best).sort((a, b) => (A.best[b].e - A.best[a].e) || (A.best[b].reps - A.best[a].reps));
  if (ids.length) {
    h += `<section class="stack"><h2 class="h2">Личные рекорды</h2><div>${ids.map(id => {
      const b = A.best[id], ex = exById(id);
      const main = b.w > 0 ? `${fmtW(b.w)}${NB}кг` : `${b.reps}${NB}повт`;
      const sub2 = b.w > 0 ? `× ${b.wR} · ${dShort(b.wT)}` : dShort(b.repsT);
      const sub = b.e > 0 && b.w > 0 ? `1ПМ ≈ ${fmtW(r05(b.e))}${NB}кг · ${pl(b.n, 'занятие', 'занятия', 'занятий')}` : pl(b.n, 'занятие', 'занятия', 'занятий');
      return `<div class="rec-row"><span class="rec-name">${esc(ex.name)}</span><span class="rec-main">${ex.bw && b.w > 0 ? '+' : ''}${main}</span><span class="rec-sub">${sub}</span><span class="rec-sub2">${sub2}</span></div>`;
    }).join('')}</div></section>`;
  } else {
    h += emptyState('Рекордов пока нет', 'Они появятся, когда вы повторите упражнение и сделаете больше, чем в прошлый раз.', 'records');
  }
  const feed = A.prs.slice(-10).reverse();
  if (feed.length) h += `<section class="stack"><h2 class="h2">Лента рекордов</h2><div class="pr-list">${feed.map(p =>
    `<div class="pr-row"><span class="pdot" aria-hidden="true"></span><div><div class="pr-name">${esc(exById(p.ex).name)}</div><div class="pr-val">${prText(p)} · ${prPrev(p)}</div></div><span class="pr-date">${dShort(p.t)}</span></div>`).join('')}</div></section>`;
  return h;
}

/* Lay the blocks out: fixed ones first, list blocks take what is left, spare room widens the gaps. */
function scDraw(d, fmt, P) {
  const story = fmt === 'story', W = SC_W, H = story ? 1920 : 1350, top = story ? 140 : 64, bot = story ? 160 : 68;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'), gap = story ? 38 : 30;
  const prs = d.prs.length ? scList(c, 'Личные рекорды', d.prs, P, story, 'pr') : null, ach = d.ach && d.ach.length ? scAch(c, d, P, story) : null;
  const plan = d.kind === 'w'
    ? [['head', 0, scHead(c, d, P, story, gap)], ['hero', 0, scHeroW(c, d, P, story)],
      ['prs', 1, prs && ach ? m => prs(m - ach.h - gap) || prs(m) : prs],   // leave the medal row its room when a record row still fits
      ['ach', 1, ach],
      ['ex', 2, !d.prs.length || story ? scList(c, 'Упражнения', d.items, P, story, 'ex', d.prs.length ? 2 : 1) : null],
      ['foot', 3, scFoot(c, d, P)], ['quote', 4, story ? scQuote(c, d, P) : null]]
    : [['head', 0, scHead(c, d, P, story, gap)], ['hero', 0, scHeroWeek(c, d, P, story)], ['tiles', 0, scTiles(c, d, P, story)],
      ['prs', 1, d.prs.length ? scList(c, 'Рекорды недели', d.prs, P, story, 'pr') : null],
      ['foot', 3, scFoot(c, d, P)], ['quote', 4, story ? scQuote(c, d, P) : null]];
  let room = H - top - 64 - bot - 24;
  const got = {};
  for (const pri of [0, 1, 2, 3, 4]) for (const [k, p, b] of plan) {
    if (p !== pri || !b) continue;
    const blk = typeof b === 'function' ? b(room - gap) : (pri ? (b.h + gap <= room ? b : null) : b);
    if (blk) { got[k] = blk; room -= blk.h + gap; }
  }
  const list = plan.filter(([k]) => got[k]).map(([k]) => got[k]);
  d.achShown = !!got.ach;
  const g = gap + Math.min(Math.max(0, room) / (list.length + 1), story ? 64 : 34), spare = Math.max(0, room - (g - gap) * list.length);
  let y = top + 64 + 24 + g + spare * 0.4;
  const pos = list.map(b => { const at = y; y += b.h + g; return at; });
  const ko = [[SC_M, top - 6, W - SC_M, top + 70]].concat(list.map((b, i) => [SC_M, pos[i] - 4, W - SC_M, pos[i] + b.h + (b.ko ? 4 : 22)]));
  scBg(c, W, H, P, d.seed, ko);
  scBar(c, d, P, top);
  list.forEach((b, i) => b.draw(pos[i]));
  if (d.gk) { const G = scGkSize(story); c.drawImage(d.gk, SC_W - SC_M - 18 - G, pos[1] + SC_GK_IN - G * 0.96, G, G); }
  return cv;
}

/* ---- optional: the art module's mascot, in light-theme colours whatever the app theme (the card is always light) ---- */
const SC_GK_IN = 30, scGkSize = story => story ? 250 : 220, scGkCache = {};
function scGk(d, story) {
  if (typeof mascotSVG !== 'function') return Promise.resolve(null);
  const mood = d.kind === 'w' ? (d.rec ? 'proud' : 'happy') : d.s.count >= d.s.goal ? 'proud' : 'cheer', G = scGkSize(story), k = mood + G;
  if (!scGkCache[k]) scGkCache[k] = new Promise(res => {
    const r = document.documentElement, was = r.getAttribute('data-theme');
    let src = '';
    try { r.setAttribute('data-theme', 'light'); src = mascotSVG(mood, G, { solid: true }); } catch (e) { src = ''; }
    finally { if (was == null) r.removeAttribute('data-theme'); else r.setAttribute('data-theme', was); }
    if (!src) { res(null); return; }
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);

}

/* ---- the workout's new medals (achievements module), resolved in light-theme colours like the mascot ---- */
function scMedalImgs(list) {

  const r = document.documentElement, was = r.getAttribute('data-theme');
  let srcs = [];

  finally { if (was == null) r.removeAttribute('data-theme'); else r.setAttribute('data-theme', was); }
  return Promise.all(srcs.map((src, i) => new Promise(res => { const im = new Image(); im.onload = () => res({ ...list[i], im }); im.onerror = () => res(null); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src); })))

/* ---- fonts: the card uses the app fonts; offline they come from the site folder, in the Claude link from Google Fonts ---- */

    <p class="note sc-hint"${save && !touch ? ' hidden' : ''}>${save ? 'Или нажмите на картинку и удерживайте, чтобы сохранить её в «Фото».' : 'Нажмите на картинку и удерживайте, чтобы сохранить её в «Фото» или отправить.'}</p>

function scClose() {
  sc.v++; sc.blob = null;

async function scRender() {
  const v = ++sc.v, st = $('#sc-stage'), go = $('#sc-go');
  if (!st) return;
  st.classList.add('busy'); if (go) go.disabled = true;
  await scFonts();
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  if (v !== sc.v || !$('#sc-stage')) return;
  const d = scData();

  d.gk = await scGk(d, sc.fmt === 'story');
  if (d.ach) d.ach = await scMedalImgs(d.ach);
  let blob = null;
  for (const art of d.gk || (d.ach && d.ach.length) ? [1, 0] : [0]) {
    if (!art) { d.gk = null; d.ach = null; }
    let cv = null;
    try { cv = scDraw(d, sc.fmt, SC_PAL[sc.pal]); blob = await new Promise(r => cv.toBlob(r, 'image/png')); } catch (e) { blob = null; }

  const img = $('#sc-img');

  img.alt = d.kind === 'w' ? `Карточка тренировки: ${d.date}, ${d.vol ? fmtKg(d.vol) : pl(d.reps, 'повтор', 'повтора', 'повторов')}, ${pl(d.sets, 'подход', 'подхода', 'подходов')}${d.prs.length ? ', ' + pl(d.prs.length, 'рекорд', 'рекорда', 'рекордов') : ''}${d.achShown ? ', ' + pl(d.ach.length, 'новая медаль', 'новые медали', 'новых медалей') : ''}`
    : `Карточка недели: ${d.date}, ${d.s.count} из ${d.s.goal} тренировок, ${fmtKg(d.s.vol)}`;

function scDownload() {
  const a = document.createElement('a');

function unlockAudio() {

      const o = actx.createOscillator(), g = actx.createGain();

      g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.02);

    ]],
    ['День 3 · Ягодицы акцент', 'В конце 15 минут ходьбы в горку.', [
      ['glute_bridge', 0, 0, [20, 20, 20], 3, '20', '', 60, 'Резинка над коленями'],
      ['kickback', 10, 0.5, [15, 15, 15], 3, '15 на каждую ногу', '10', 45, ''],
      ['leg_press', 35, 7.5, [12, 12, 12], 3, '12', '60', 90, 'Стопы высоко и широко'],
      ['leg_curl', 20, 1.25, [12, 12, 12], 3, '12', '20', 60, ''],
      ['step_up', 6, 0.5, [12, 12, 12], 3, '12 на каждую ногу', '6', 60, ''],
    ]],
  ];
  const pid = 'demo-prog';
  st.programs.push({ id: pid, name: 'Ягодицы и тонус', coach: 'Катя', note: 'Вес добавляем, когда все подходы выходят на верхнюю границу повторов.', created: addDays(cur, -63), days:
    plan.map(([name, note, items]) => ({ name, note, items: items.map(([ex, , , , sets, reps, w, rest, n]) => ({ ex, sets, reps, w, rest, note: n })) })) });
  st.prog = { id: pid, next: 0 };
  const WEEKS = 9;
  for (let k = WEEKS - 1; k >= 0; k--) {
    const ws = addDays(cur, -7 * k), week = WEEKS - 1 - k, steps = week - Math.floor(week / 3);
    [0, 2, 4].forEach((dd, di) => {
      if (k === 5 && di === 2) return;
      if (k === 0 && dd > todayIdx) return;
      const d = new Date(addDays(ws, dd));
      if (k === 0 && dd === todayIdx) d.setHours(7, 40, 0, 0); else d.setHours(k === 4 && di === 1 ? 21 : 18, 20 + Math.floor(rnd() * 25), 0, 0);
      const start = d.getTime();
      if (start + 75 * 60000 > now) return;
      const items = plan[di][2].map(([ex, base, inc, reps]) => {
        const w = base ? base + inc * steps : 0;
        return { ex, sets: reps.map(r => ({ w, r: Math.max(1, r + (base ? 0 : Math.floor(week / 2)) - (rnd() < 0.22 ? 1 : 0)) })) };
      });
      st.workouts.push({ id: `demo-${k}-${di}`, start, end: start + (52 + Math.floor(rnd() * 22)) * 60000, items, plan: { p: pid, d: di, n: plan[di][0] }, mood: 3 + Math.floor(rnd() * 3) });
      st.prog.next = (di + 1) % plan.length;
    });
    if (k === 3) {
      const d = new Date(addDays(ws, 5)); d.setHours(11, 10, 0, 0);
      st.workouts.push({ id: 'demo-sat', start: d.getTime(), end: d.getTime() + 48 * 60000, mood: 5,
        items: [['squat', 40, [10, 10, 8]], ['bench', 30, [10, 10, 10]], ['bb_curl', 15, [12, 12, 10]], ['pushdown', 15, [15, 15, 12]], ['crunch', 0, [20, 20, 20]]].map(([ex, w, rs]) => ({ ex, sets: rs.map(r => ({ w, r })) })) });
    }
  }
  for (let t = addDays(cur, -62), kg = 63.6; t <= now; t = addDays(t, 4)) {
    kg += -0.12 + (rnd() - 0.5) * 0.5;
    st.body.push({ t: t + 8 * 3600000, kg: Math.round(kg * 10) / 10 });
  }
  for (let k = 13; k >= 1; k--) st.water.days[dk(addDays(now, -k))] = k > 9 ? 5 + Math.floor(rnd() * 3) : 8 + Math.floor(rnd() * 2);
  st.water.days[dk(now)] = 5;
  return st;
}

    setTimeout(() => focusIn('bw-in'), 250);
  },
  'bw-add': () => {
    const v = num($('#bw-in') ? $('#bw-in').value : '');
    if (!(v >= 25 && v <= 300)) { toast('Впишите вес в килограммах', 'Например, 58,5'); focusIn('bw-in'); return; }
    const key = dk(Date.now()), a0 = achSnap(), q0 = questSnap();
    S.body = S.body.filter(e => dk(e.t) !== key).concat([{ t: Date.now(), kg: Math.round(v * 10) / 10 }]).sort((a, b) => a.t - b.t).slice(-400);
    ver++; save(); closeSheet(); render(); toast('Вес записан', fmtW(Math.round(v * 10) / 10) + NB + 'кг');
    achCelebrate(a0); questAfter(q0);
  },
  'bw-del': () => { const e = S.body[S.body.length - 1]; if (e) achForget(e.t); S.body = S.body.slice(0, -1); ver++; save(); render(); },
  mood: el => {
    const w = S.workouts.find(x => x.id === el.dataset.id); if (!w) return;
    const m = +el.dataset.m, a0 = achSnap();
    if (w.mood === m) delete w.mood; else w.mood = m;
    ver++; save(); achCelebrate(a0);
    document.querySelectorAll('[data-a="mood"]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.m === w.mood)));
  },
};
function pickToDraft(it) {
  const P = ui.pick, d = imp.draft && imp.draft.days[P.d];
  ui.pick = null;
  if (!d) { closeSheet(); return; }
  if (P.i < 0) d.items.push({ sets: 3, reps: '', w: '', rest: 0, note: '', ...it });
  else { const o = d.items[P.i]; delete o.nw; Object.assign(o, it); }
  openReview();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const f = ACT[el.dataset.a];
  if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('pointerdown', unlockAudio, { passive: true });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList.contains('in')) {
    const row = t.closest('.set'); if (!row || !S.active) return;
    const s = S.active.items[+row.dataset.i].sets[+row.dataset.j];
    s[t.dataset.f] = t.value;
    saveSoon(); updateWkSum();
  } else if (t.id === 'pick-q') renderPickList(t.value);
  else if (t.id === 'set-name') { S.settings.name = t.value.trim().slice(0, 24); saveSoon(); }
  else if (t.id === 'imp-text') imp.text = t.value;
  else if (t.dataset && t.dataset.rv && imp.draft) {
    const k = t.dataset.rv, D = imp.draft;
    if (k === 'name') D.name = t.value.slice(0, 60);
    else if (k === 'coach') D.coach = t.value.slice(0, 40);
    else if (k === 'dname') D.days[+t.dataset.d].name = t.value.slice(0, 60);
    else {
      const it = D.days[+t.dataset.d].items[+t.dataset.i];
      if (k === 'wkc') {
        const y = it.wk[+t.dataset.k], v = t.value.trim(), m = v.match(/^(\d{1,2})\s*[xхХX×*]\s*(\S.*)$/);
        if (m) { y.s = clamp(+m[1], 0, 20); y.r = m[2] === '?' ? '' : m[2].slice(0, 30); } else { y.s = 0; y.r = /^\d/.test(v) ? v.slice(0, 30) : ''; }
        const b = it.wk.find(x => x.s || x.r); it.sets = b ? b.s : 0; it.reps = b ? b.r : '';
      }
      else it[k] = k === 'sets' ? clamp(Math.round(num(t.value)) || 0, 0, 20) : t.value.slice(0, 30);
    }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'prog-ex') { ui.progEx = t.value; render(); }
  else if ((t.id === 'imp-photo' || t.id === 'imp-file') && t.files) {
    for (const f of t.files) if (!imp.files.some(x => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified)) imp.files.push(f);
    imp.files = imp.files.slice(-10);
    t.value = ''; renderImpFiles();
    const st = $('#imp-st'); if (st && !imp.busy) st.innerHTML = '';
  }
  else if (t.id === 'bk-file' && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => checkBackup(fr.result);
    fr.onerror = () => { $('#bk-msg').innerHTML = '<p class="note err">Не получилось открыть файл.</p>'; };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet-wrap')) { dismissSheet(); return; }
  const t = e.target;
  if (e.key === 'Enter' && t.classList && t.classList.contains('in')) {
    e.preventDefault();
    if (t.dataset.f === 'w') { const r = t.closest('.set').querySelector('[data-f="r"]'); if (r) r.focus(); }
    else t.blur();
  } else if (e.key === 'Enter' && t.id === 'bw-in') { e.preventDefault(); ACT['bw-add'](); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    keepAwake(true); updateRest();
    if (cloud.on && Date.now() - cloud.pulledAt > 60000 && !saveT && !cloud.busy && !cloud.t) cloudPull().then(applyMerge, () => cloudState('err'));
  } else { if (saveT) save(); if (cloud.t) cloudSync(); }
});
window.addEventListener('pagehide', () => { if (saveT) save(); if (cloud.t) cloudSync(); });

setInterval(() => {
  if (!S.active) return;
  const c = $('#clock'); if (c) c.textContent = clock(Date.now() - S.active.start);
  const c2 = $('#top-clock'); if (c2) c2.textContent = clock(Date.now() - S.active.start);
  const c3 = $('#wk-kcal'); if (c3) c3.textContent = liveKcal();
  updateRest();
}, 500);

/* ---------- boot ---------- */
if (!real.workouts.length && !real.active && !real.settings.introDone) { setMode(true); autoDemo = true; }
achDefs();
render(true);
cloudInit();
keepAwake(true);
if (VENDOR && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (!FRAMED && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
